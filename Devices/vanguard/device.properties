general.vendor=bi0s
general.name=Vanguard
general.incubating=true

# Challenge-selection menu (Devices/vanguard/source/ui/ChallengeMenu.cpp)
apps.launcherAppId=vanguard.menu

hardware.target=ESP32S3
hardware.flashSize=16MB
# Matches the flash mode of the original Vanguard firmware (proven on this board)
hardware.flashMode=DIO
# ESP32-S3-WROOM-1 without PSRAM (eFuse PSRAM_CAP=0)
hardware.spiRam=false
# Off until the first milestone (display + input) is stable
hardware.bluetooth=false

# No SD card slot
storage.userDataLocation=Internal

# Panel diagonal is not documented: 2.4" assumed (240x320 ST7789 module). Only affects UI scaling.
display.size=2.4"
display.shape=rectangle
display.dpi=167

lvgl.colorDepth=16

# OT range networking: IP forwarding + NAPT so emulated zones (10.0.2-5.x) DNAT to the badge
sdkconfig.CONFIG_LWIP_IP_FORWARD=y
sdkconfig.CONFIG_LWIP_IPV4_NAPT=y
sdkconfig.CONFIG_LWIP_IPV4_NAPT_PORTMAP=y
# Raise the lwIP socket pool: the range runs ~9 concurrent protocol listeners (HTTP 80, Modbus 502,
# S7 102, IEC-104 2404, TriStation 1502, OPC-UA 4840, Pump 7700, Historian 9000, Dam modem 9003,
# GOOSE/UDP) plus accepted client sockets; the default of 10 is exhausted. Tracked here so the fix is
# reproducible from a clean checkout (was previously only set in the git-ignored local sdkconfig).
sdkconfig.CONFIG_LWIP_MAX_SOCKETS=16
